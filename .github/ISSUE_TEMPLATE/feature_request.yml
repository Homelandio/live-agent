name: Feature request
description: Suggest a focused improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the public, reproducible behavior. Do not attach personal knowledge-base files, API keys, or private recordings.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user workflow needs improvement?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What behavior would you expect?
    validations:
      required: true
